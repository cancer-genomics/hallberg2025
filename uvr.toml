# ENV-24: these five were exact CRAN pins (`pkg = "x.y.z"`). CRAN's live index
# serves only the current version, so once it moved past each of these the
# resolver rejected the constraint outright -- `uvr lock` and every `uvr add`
# failed with "No version of '<pkg>' satisfies constraint", stopping at whichever
# it reached first. Pinned here to the CRAN GitHub mirror at the exact commit
# tagged with the pinned version instead: resolution goes through git rather than
# the CRAN index, so an archived version stays installable. This is the EXT-01
# pattern ENV-09 validated and BASE-02 used for deconstructSigs.
#
# Each `rev` was checked by reading DESCRIPTION at that SHA and confirming its
# Version field, not by trusting the tag name.
#
# Deliberately NOT loosened to "*": that silently upgrades. ggtext and ggstats
# render plot text and so feed figure hashes; any upgrade must be a gated change
# with a CHANGES.md entry, not a side effect of unblocking the resolver.

[dependencies.ggstats]
git = "cran/ggstats"
rev = "1e825069c09353e8111e693d9a3f392d69f7b7bf"        # 0.13.0

[dependencies.ggtext]
git = "cran/ggtext"
rev = "7786276451a46819999af49c9d9b83f977ef0434"        # 0.1.2

[dependencies.httr]
git = "cran/httr"
rev = "78e8544cb8e089c9764995e153745badb35b45a4"        # 1.4.8

[dependencies.renv]
git = "cran/renv"
rev = "da8ba7d99381c1827608ec5197ee025ff68ae87f"        # 1.2.3

[dependencies.stringi]
git = "cran/stringi"
rev = "27a9b92f62e014ea23af73477fde0803d0c5ea7d"        # 1.8.7
